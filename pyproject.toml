[project]
name = "amu"
dynamic = ["version"]
description = "Anti-Messup Agent – scope guardrail for AI code edits (TWC Buildathon 2026, Track 2)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "markdown-it-py>=3.0,<5",
    "prompt_toolkit>=3.0",
    "watchfiles>=0.20",
]

[project.optional-dependencies]
model = ["anthropic"]
mcp = ["mcp"]
coverage = ["coverage>=7.16,<8"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "anthropic", "mcp", "build", "setuptools==84.0.0"]

[project.scripts]
amu = "amu.cli:app"
entire-amu = "amu.cli:app"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amu*"]

[tool.setuptools.package-data]
amu = ["skills/*/SKILL.md", "benchmark_data/*.json", "benchmark_data/shared-cache-v1/*.py",
       "benchmark_data/shared-cache-v1/*.json", "benchmark_data/shared-cache-v1/patches/*.diff",
       "benchmark_data/phase3-counterexamples-v1/*.py", "benchmark_data/phase3-counterexamples-v1/*.json",
       "benchmark_data/phase3-counterexamples-v1/*.md", "benchmark_data/phase3-counterexamples-v1/*/*.py",
       "benchmark_data/phase3-counterexamples-v1/*/*.json", "benchmark_data/phase3-counterexamples-v1/*/patches/*.diff"]

[tool.setuptools.dynamic]
version = {attr = "amu.__version__"}

[tool.pytest.ini_options]
# The checkout demo is a separate project exercised by hackathon/replay_demo.py.
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
